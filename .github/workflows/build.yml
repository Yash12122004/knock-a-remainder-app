name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which current cmdline-tools no longer ship.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every runner is fresh, so without this each build gets a new random debug key and
      # Android refuses to install it over the previous APK. The key lives in a repo secret
      # rather than the repo, because the repo is public. app/build.gradle.kts reads the path.
      - name: Install stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set. The APK would be signed with a random key and could not update an installed copy."
            exit 1
          fi
          ks="$RUNNER_TEMP/knock-debug.keystore"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
          echo "KNOCK_DEBUG_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Guard: fail rather than ship an APK that can't update an installed Knock.
      - name: Verify signing certificate
        run: |
          expected=5d124b715d28d6b05e4950491d9ba2ce96103f66108e2c77211011c6be034a66
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          actual=$("$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | sed 's/.*digest: //')
          echo "certificate: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with $actual, expected $expected. It would not install over an existing Knock."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
