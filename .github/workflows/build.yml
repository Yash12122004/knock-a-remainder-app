name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which current cmdline-tools no longer ship.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every runner is fresh, so without this each build gets a new random debug key and
      # Android refuses to install it over the previous APK. The key lives in a repo secret
      # rather than the repo, because the repo is public.
      - name: Install stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set. The APK would be signed with a random key and could not update an installed copy."
            exit 1
          fi
          dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$dir"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
